{% extends "base.html" %}
{% block title %}添加商品{% endblock %}
{% block page_title %}➕ 添加商品{% endblock %}

{% block content %}
<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">商品名称 <span class="text-danger">*</span></label>
                    <input type="text" name="name" class="form-control" required placeholder="输入商品名称">
                </div>
                <div class="col-md-3">
                    <label class="form-label">SKU编码</label>
                    <input type="text" name="sku" class="form-control" placeholder="如：SKU001">
                </div>
                <div class="col-md-3">
                    <label class="form-label">条形码</label>
                    <input type="text" name="barcode" class="form-control" placeholder="商品条码">
                </div>
            </div>
            
            <div class="row mb-3">
                <div class="col-md-3">
                    <label class="form-label">分类</label>
                    <input type="text" name="category" class="form-control" placeholder="如：服装、数码">
                </div>
                <div class="col-md-2">
                    <label class="form-label">单位</label>
                    <select name="unit" class="form-select">
                        <option value="件">件</option>
                        <option value="个">个</option>
                        <option value="箱">箱</option>
                        <option value="斤">斤</option>
                        <option value="kg">kg</option>
                        <option value="米">米</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">供应商</label>
                    <input type="text" name="supplier" class="form-control" placeholder="供应商名称">
                </div>
            </div>
            
            <div class="row mb-3">
                <div class="col-md-3">
                    <label class="form-label">成本价 (元)</label>
                    <input type="number" name="cost_price" class="form-control" step="0.01" value="0">
                </div>
                <div class="col-md-3">
                    <label class="form-label">售价 (元) <span class="text-danger">*</span></label>
                    <input type="number" name="sell_price" class="form-control" step="0.01" value="0" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">初始库存</label>
                    <input type="number" name="initial_stock" class="form-control" value="0" min="0">
                </div>
            </div>
            
            <div class="row mb-4">
                <div class="col-md-3">
                    <label class="form-label">最低库存预警</label>
                    <input type="number" name="min_stock" class="form-control" value="10" min="0">
                </div>
                <div class="col-md-3">
                    <label class="form-label">最高库存限制</label>
                    <input type="number" name="max_stock" class="form-control" value="200" min="0">
                </div>
            </div>
            
            <hr>
            <div class="d-flex justify-content-between">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-circle"></i> 保存商品
                </button>
                <a href="{{ url_for('main.product_list') }}" class="btn btn-outline-secondary">取消</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
